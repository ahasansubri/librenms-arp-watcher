name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m py_compile arp_watcher.py
      - name: Validate orchestration shell syntax
        run: bash -n scripts/arp-monitor-cycle
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate example configuration without external access
        run: python arp_watcher.py --config examples/config.json.example --validate-config
      - name: Public repository hygiene checks
        run: python scripts/check_repository.py
